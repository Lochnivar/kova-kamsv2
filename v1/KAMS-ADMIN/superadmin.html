<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Superadmin Settings</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0f1724;--muted:#9aa4b2;--accent:#6ee7b7;--accent-2:#60a5fa;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial}
*{box-sizing:border-box}
body{margin:0;background:linear-gradient(180deg,#071023,#071827);color:#e6eef6;min-height:100vh}
.container{max-width:1200px;margin:28px auto;padding:20px}
.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
.h-title{font-size:20px;font-weight:700}
.toolbar{display:flex;gap:8px}
.btn{background:var(--accent-2);color:#04203a;border:none;padding:8px 12px;border-radius:8px;font-weight:600;cursor:pointer}
.btn.ghost{background:transparent;border:1px solid rgba(255,255,255,0.06);color:var(--muted)}
.card{background:linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));border-radius:12px;padding:16px;box-shadow:0 6px 30px rgba(2,6,23,0.6);border:1px solid rgba(255,255,255,0.03)}
.table{width:100%;border-collapse:collapse;margin-top:12px}
.table th{font-weight:600;padding:10px;text-align:left;color:var(--muted);font-size:13px;border-bottom:1px solid rgba(255,255,255,0.04)}
.table td{padding:8px;border-top:1px dashed rgba(255,255,255,0.03);vertical-align:middle}
.input,select,textarea{width:100%;padding:8px;border-radius:6px;border:1px solid rgba(255,255,255,0.06);background:transparent;color:inherit}
.small{font-size:13px;color:var(--muted)}
.controls{display:flex;gap:8px;align-items:center}
.tag{display:inline-block;padding:6px 8px;border-radius:999px;background:rgba(255,255,255,0.03);font-size:12px;color:var(--muted)}
.empty{padding:28px;text-align:center;color:var(--muted)}
.confirm{color:#fca5a5}
.modal{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(2,6,23,0.6);z-index:60}
.modal-box{background:#071827;padding:18px;border-radius:10px;min-width:420px;border:1px solid rgba(255,255,255,0.04);max-width:92%;max-height:88%;overflow:auto}
.kv-row{display:flex;gap:8px;align-items:center}
.kv-row input[type="text"]{flex:1}
.warn{color:#fbbf24}
@media(max-width:980px){
  .table td{font-size:13px}
  .controls{flex-wrap:wrap}
}
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <div>
      <div class="h-title">Superadmin Settings</div>
      <div class="small">Full access to all columns: name, value, type, group_name, sort_order, description, create, update, delete.</div>
    </div>
    <div class="toolbar">
      <button id="reloadBtn" class="btn ghost">Reload</button>
      <button id="exportBtn" class="btn">Export JSON</button>
      <button id="logoutBtn" class="btn ghost" style="display:none">Logout</button>
    </div>
  </div>

  <div id="mainCard" class="card" style="display:none">
    <div style="margin-bottom:12px;display:flex;gap:12px;align-items:center">
      <div style="flex:1">
        <input id="search" class="input" placeholder="Search name, group, or description" />
      </div>
      <div style="width:220px">
        <select id="filterGroup" class="input">
          <option value="">All groups</option>
        </select>
      </div>
      <div class="controls">
        <button id="newBtn" class="btn">New Setting</button>
      </div>
    </div>

    <table class="table" id="settingsTable">
      <thead>
        <tr>
          <th style="width:240px">Name</th>
          <th>Value</th>
          <th style="width:120px">Type</th>
          <th style="width:140px">Group</th>
          <th style="width:90px">Order</th>
          <th style="width:220px">Description</th>
          <th style="width:160px">Actions</th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>

    <div id="empty" class="empty" style="display:none">No settings found</div>
    <div class="small" style="margin-top:12px;color:var(--muted)">Changes are immediate. Use Export to back up settings.</div>
  </div>
</div>

<!-- Login modal -->
<div id="loginModal" class="modal">
  <div class="modal-box">
    <div style="margin-bottom:10px;font-weight:700">Superadmin Login</div>
    <div class="small" style="margin-bottom:6px">Password</div>
    <input id="pw" class="input" type="password" placeholder="Enter password" />
    <div style="display:flex;gap:8px;margin-top:12px;justify-content:flex-end">
      <button id="pwBtn" class="btn">Login</button>
    </div>
    <div id="loginMsg" class="small" style="margin-top:8px;color:#fca5a5;display:none"></div>
  </div>
</div>

<!-- New/Edit modal -->
<div id="editModal" class="modal" style="display:none">
  <div class="modal-box">
    <div style="font-weight:700;margin-bottom:8px" id="editTitle">Edit Setting</div>

    <div class="kv-row" style="margin-bottom:8px">
      <div style="width:240px"><label class="small">Name</label><input id="m_name" class="input" type="text" /></div>
      <div style="width:140px"><label class="small">Type</label>
        <select id="m_type" class="input">
          <option value="string">string</option>
          <option value="text">text</option>
          <option value="int">int</option>
          <option value="float">float</option>
          <option value="bool">bool</option>
          <option value="json">json</option>
          <option value="list">list</option>
          <option value="object">object</option>
        </select>
      </div>
    </div>

    <div style="margin-bottom:8px">
      <label class="small">Value</label>
      <textarea id="m_value" class="input" rows="6" style="font-family:ui-monospace, SFMono-Regular, Menlo, Monaco, 'Roboto Mono', monospace"></textarea>
    </div>

    <div class="kv-row" style="margin-bottom:8px">
      <div style="width:220px"><label class="small">Group</label><input id="m_group" class="input" type="text" /></div>
      <div style="width:120px"><label class="small">Order</label><input id="m_order" class="input" type="number" /></div>
      <div style="flex:1"><label class="small">Description</label><input id="m_description" class="input" type="text" /></div>
    </div>

    <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:6px">
      <button id="deleteBtn" class="btn ghost confirm">Delete</button>
      <button id="saveBtn" class="btn">Save</button>
      <button id="cancelBtn" class="btn ghost">Cancel</button>
    </div>
    <div id="editMsg" class="small" style="margin-top:8px;color:#fca5a5;display:none"></div>
  </div>
</div>

<script>
const API = './superadmin_api.php';
let allRows = [];
let editingId = null;

function esc(s){ return String(s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

async function api(method, path='', body=null){
  const opts = { method, headers: {}, credentials: 'same-origin' };
  if(body !== null){ opts.headers['Content-Type']='application/json'; opts.body = JSON.stringify(body); }
  const res = await fetch(API + path, opts);
  if(res.status===204) return null;
  const txt = await res.text();
  try{ return JSON.parse(txt); }catch(e){ throw new Error(txt||'API error'); }
}

/* Define doLogin early and expose to window so listeners can attach safely */
window.doLogin = async function(){
  const pw = document.getElementById('pw').value;
  document.getElementById('loginMsg').style.display='none';
  try{
    const r = await fetch(API + '?action=login', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ password: pw }), credentials: 'same-origin' });
    const txt = await r.text();
    const json = (()=>{ try{ return JSON.parse(txt); }catch(e){ return { error: txt }; }})();
    if(r.ok && json.success){
      document.getElementById('pw').value = '';
      document.getElementById('loginModal').style.display='none';
      document.getElementById('mainCard').style.display='block';
      document.getElementById('logoutBtn').style.display='inline-block';
      await load();
      return;
    }
    document.getElementById('loginMsg').innerText = json.error || 'Login failed';
    document.getElementById('loginMsg').style.display = 'block';
  }catch(e){
    document.getElementById('loginMsg').innerText = 'Login error';
    document.getElementById('loginMsg').style.display = 'block';
  }
};

async function checkAuth(){
  try{
    const r = await api('GET','?auth=check');
    if(r && r.auth === true){ document.getElementById('loginModal').style.display='none'; document.getElementById('mainCard').style.display='block'; document.getElementById('logoutBtn').style.display='inline-block'; await load(); return; }
  }catch(e){}
  document.getElementById('loginModal').style.display='flex'; document.getElementById('mainCard').style.display='none'; document.getElementById('logoutBtn').style.display='none';
}

/* Attach UI listeners (doLogin already defined) */
document.getElementById('reloadBtn').addEventListener('click', load);
document.getElementById('exportBtn').addEventListener('click', async ()=>{
  const rows = await api('GET','');
  const blob = new Blob([JSON.stringify(rows, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = 'settings-superadmin.json'; document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
});
document.getElementById('pwBtn').addEventListener('click', doLogin);
document.getElementById('pw').addEventListener('keydown', function(e){ if(e.key==='Enter'){ e.preventDefault(); doLogin(); }});
document.getElementById('logoutBtn').addEventListener('click', async ()=>{
  await fetch(API + '?action=logout', { method:'POST', credentials: 'same-origin' });
  document.getElementById('pw').value = '';
  document.getElementById('loginModal').style.display='flex';
  document.getElementById('mainCard').style.display='none';
  document.getElementById('logoutBtn').style.display='none';
});

document.getElementById('newBtn').addEventListener('click', ()=> openEditModal(null));
document.getElementById('cancelBtn').addEventListener('click', closeEditModal);
document.getElementById('saveBtn').addEventListener('click', saveEdit);
document.getElementById('deleteBtn').addEventListener('click', deleteRow);

document.getElementById('search').addEventListener('input', renderTable);
document.getElementById('filterGroup').addEventListener('change', renderTable);

/* Core data/load/render functions */
async function load(){
  try{
    const rows = await api('GET','');
    allRows = Array.isArray(rows) ? rows : [];
    populateGroupFilter();
    renderTable();
  }catch(e){
    console.error(e);
    document.getElementById('tbody').innerHTML = '<tr><td colspan="7" class="small">Error loading</td></tr>';
  }
}

function populateGroupFilter(){
  const groups = new Set(allRows.map(r => r.group_name || 'default'));
  const sel = document.getElementById('filterGroup');
  sel.innerHTML = '<option value="">All groups</option>';
  Array.from(groups).sort().forEach(g => {
    const o = document.createElement('option'); o.value = g; o.text = g; sel.appendChild(o);
  });
}

function renderTable(){
  const q = (document.getElementById('search').value||'').toLowerCase();
  const filter = document.getElementById('filterGroup').value;
  const rows = allRows
    .filter(r => {
      if(filter && (r.group_name||'default') !== filter) return false;
      if(!q) return true;
      return (String(r.name||'') + ' ' + String(r.description||'') + ' ' + String(r.group_name||'')).toLowerCase().includes(q);
    })
    .sort((a,b)=>{
      const ga = (a.group_name||'default'); const gb = (b.group_name||'default');
      if(ga !== gb) return ga.localeCompare(gb);
      const oa = (a.sort_order!==undefined && a.sort_order!==null) ? Number(a.sort_order) : 100;
      const ob = (b.sort_order!==undefined && b.sort_order!==null) ? Number(b.sort_order) : 100;
      if(oa !== ob) return oa - ob;
      return (a.name||'').localeCompare(b.name||'');
    });

  const tbody = document.getElementById('tbody');
  if(rows.length === 0){ document.getElementById('settingsTable').style.display='none'; document.getElementById('empty').style.display='block'; return; }
  document.getElementById('settingsTable').style.display='table'; document.getElementById('empty').style.display='none';
  tbody.innerHTML = rows.map(r=>{
    const id = r.id ?? 0;
    const name = esc(r.name ?? '');
    const value = esc(r.value ?? '');
    const type = esc(r.type ?? 'string');
    const group = esc(r.group_name ?? 'default');
    const order = esc(String(r.sort_order ?? 100));
    const desc = esc(r.description ?? '');
    return `<tr data-id="${id}">
      <td><input class="input" data-field="name" value="${name}" /></td>
      <td><textarea class="input" data-field="value" rows="2">${value}</textarea></td>
      <td>
        <select class="input" data-field="type">
          <option ${type==='string'?'selected':''} value="string">string</option>
          <option ${type==='text'?'selected':''} value="text">text</option>
          <option ${type==='int'?'selected':''} value="int">int</option>
          <option ${type==='float'?'selected':''} value="float">float</option>
          <option ${type==='bool'?'selected':''} value="bool">bool</option>
          <option ${type==='json'?'selected':''} value="json">json</option>
          <option ${type==='list'?'selected':''} value="list">list</option>
          <option ${type==='object'?'selected':''} value="object">object</option>
        </select>
      </td>
      <td><input class="input" data-field="group_name" value="${group}" /></td>
      <td><input class="input" data-field="sort_order" type="number" value="${order}" /></td>
      <td><input class="input" data-field="description" value="${desc}" /></td>
      <td class="controls">
        <button class="btn ghost" onclick="openEditModal(${id})">Open</button>
        <button class="btn" onclick="saveRowInline(${id}, this)">Save</button>
        <button class="btn ghost confirm" onclick="deleteRowInline(${id}, this)">Delete</button>
      </td>
    </tr>`}).join('');
}

function openEditModal(id){
  editingId = id;
  document.getElementById('editMsg').style.display = 'none';
  if(id === null){
    document.getElementById('editTitle').innerText = 'New Setting';
    document.getElementById('m_name').value = '';
    document.getElementById('m_type').value = 'string';
    document.getElementById('m_value').value = '';
    document.getElementById('m_group').value = 'default';
    document.getElementById('m_order').value = '100';
    document.getElementById('m_description').value = '';
    document.getElementById('deleteBtn').style.display = 'none';
    document.getElementById('editModal').style.display = 'flex';
    return;
  }

  const row = allRows.find(r => (r.id ?? 0) == id);
  if(!row) return alert('Row not found');
  document.getElementById('editTitle').innerText = 'Edit Setting';
  document.getElementById('m_name').value = row.name ?? '';
  document.getElementById('m_type').value = row.type ?? 'string';
  document.getElementById('m_value').value = row.value ?? '';
  document.getElementById('m_group').value = row.group_name ?? 'default';
  document.getElementById('m_order').value = row.sort_order ?? 100;
  document.getElementById('m_description').value = row.description ?? '';
  document.getElementById('deleteBtn').style.display = 'inline-block';
  document.getElementById('editModal').style.display = 'flex';
}

function closeEditModal(){ document.getElementById('editModal').style.display = 'none'; editingId = null; }

async function saveEdit(){
  const name = document.getElementById('m_name').value.trim();
  const type = document.getElementById('m_type').value;
  const value = document.getElementById('m_value').value;
  const group = document.getElementById('m_group').value.trim() || 'default';
  const order = Number(document.getElementById('m_order').value || 100);
  const description = document.getElementById('m_description').value;

  if(!name) return showEditMsg('Name required');

  try{
    if(editingId === null){
      await api('POST', '', { name, type, value, group_name: group, sort_order: order, description });
      await load();
      closeEditModal();
      return;
    }
    await api('PUT', '?id=' + editingId, { name, type, value, group_name: group, sort_order: order, description });
    await load();
    closeEditModal();
  }catch(e){
    showEditMsg('Save failed: ' + (e.message || e));
  }
}

function showEditMsg(msg){
  const el = document.getElementById('editMsg'); el.innerText = msg; el.style.display = 'block';
}

async function saveRowInline(id, btn){
  const tr = btn.closest('tr');
  if(!tr) return;
  const fields = {};
  for(const input of tr.querySelectorAll('[data-field]')){
    const key = input.getAttribute('data-field');
    fields[key] = input.value;
  }
  if(fields.sort_order !== undefined) fields.sort_order = Number(fields.sort_order || 100);
  try{
    await api('PUT', '?id=' + id, fields);
    await load();
  }catch(e){ alert('Save failed: '+(e.message||e)); }
}

async function deleteRowInline(id, btn){
  if(!confirm('Delete setting id '+id+'? This is irreversible.')) return;
  try{
    await api('DELETE', '?id=' + id);
    await load();
  }catch(e){ alert('Delete failed: '+(e.message||e)); }
}

async function deleteRow(){
  if(editingId === null) return;
  if(!confirm('Delete this setting?')) return;
  try{
    await api('DELETE', '?id=' + editingId);
    closeEditModal();
    await load();
  }catch(e){ showEditMsg('Delete failed: ' + (e.message||e)); }
}

/* initial auth check */
checkAuth();
</script>
</body>
</html>
