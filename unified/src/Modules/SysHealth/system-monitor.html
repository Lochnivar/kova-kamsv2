<script>
var SYSTEM_API = 'src/Modules/SysHealth/system-monitor-ajax.php';
var systemMonitorRefreshInterval = null;

function loadSystemMonitor() {
  fetch(SYSTEM_API)
    .then(response => {
      if (!response.ok) {
        throw new Error('Network response was not ok: ' + response.status);
      }
      return response.json();
    })
    .then(data => {
      document.getElementById('loadingMessage').style.display = 'none';
      document.getElementById('errorMessage').style.display = 'none';
      
      if (data.error) {
        showSystemMonitorError(data.error + (data.message ? ': ' + data.message : ''));
        return;
      }

      renderServerStatus(data.servers || []);
      renderHistory(data.history || []);
      
      document.getElementById('serverStatusContainer').style.display = 'block';
      document.getElementById('historyContainer').style.display = 'block';
      
      updateLastUpdateTime();
    })
    .catch(error => {
      console.error('Error loading system monitor:', error);
      document.getElementById('loadingMessage').style.display = 'none';
      showSystemMonitorError('Failed to load system monitor data: ' + error.message);
    });
}

function renderServerStatus(servers) {
  const grid = document.getElementById('serverStatusGrid');
  grid.innerHTML = '';
  
  servers.forEach(server => {
    const btn = document.createElement('button');
    btn.className = 'server-status-btn';
    
    if (!server.hasProblem || server.severity <= 3) {
      btn.className += ' server-status-ok';
      btn.innerHTML = server.host + '<br>Server is Okay<br>';
    } else {
      btn.className += ' server-status-severity-' + server.severity;
      const description = server.description.length < 35 
        ? server.description 
        : server.description.substring(0, 35) + '...';
      btn.innerHTML = server.host + '<br>Severity - ' + server.severity + '<br>' + description;
    }
    
    grid.appendChild(btn);
  });
}

function renderHistory(history) {
  const tbody = document.getElementById('historyTableBody');
  tbody.innerHTML = '';
  
  if (history.length === 0) {
    tbody.innerHTML = '<tr><td colspan="4" style="text-align: center; color: #6c757d;">No history data available</td></tr>';
    return;
  }
  
  history.forEach(row => {
    const tr = document.createElement('tr');
    
    const host = row.host === 'Zabbix server' ? 'Monitor Server' : row.host;
    const severity = row.severity !== null && row.severity !== undefined ? row.severity : '';
    const description = (severity === 0 ? 'Restored - ' : '') + row.description;
    const timestamp = formatTimestamp(row.clock);
    
    const severityClass = severity === '' ? 'severity-color-empty' : 'severity-color-' + severity;
    
    tr.innerHTML = `
      <td class="${severityClass}">${escapeHtml(host)}</td>
      <td class="${severityClass}">${escapeHtml(timestamp)}</td>
      <td class="${severityClass}">${escapeHtml(description)}</td>
      <td class="${severityClass}">${escapeHtml(String(severity))}</td>
    `;
    
    tbody.appendChild(tr);
  });
}

function formatTimestamp(clock) {
  if (!clock) return '';
  const date = new Date(clock * 1000);
  return date.toLocaleString('en-US', {
    year: 'numeric',
    month: '2-digit',
    day: '2-digit',
    hour: '2-digit',
    minute: '2-digit',
    second: '2-digit'
  });
}

function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

function showSystemMonitorError(message) {
  const errorDiv = document.getElementById('errorMessage');
  errorDiv.textContent = message;
  errorDiv.style.display = 'block';
}

function updateLastUpdateTime() {
  const now = new Date();
  document.getElementById('lastUpdate').textContent = 'Last updated: ' + now.toLocaleTimeString();
}

function refreshSystemMonitor() {
  document.getElementById('loadingMessage').style.display = 'block';
  document.getElementById('serverStatusContainer').style.display = 'none';
  document.getElementById('historyContainer').style.display = 'none';
  loadSystemMonitor();
}

function startSystemMonitorAutoRefresh() {
  if (systemMonitorRefreshInterval) {
    clearInterval(systemMonitorRefreshInterval);
  }
  systemMonitorRefreshInterval = setInterval(loadSystemMonitor, 5000);
}

function stopSystemMonitorAutoRefresh() {
  if (systemMonitorRefreshInterval) {
    clearInterval(systemMonitorRefreshInterval);
    systemMonitorRefreshInterval = null;
  }
}

// Initialize when page loads
document.addEventListener('DOMContentLoaded', function() {
  loadSystemMonitor();
  startSystemMonitorAutoRefresh();
});

// Clean up on page unload
window.addEventListener('beforeunload', function() {
  stopSystemMonitorAutoRefresh();
});
</script>
